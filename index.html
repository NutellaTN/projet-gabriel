<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carte de la Débâcle – Surveillance en Temps Réel</title>
</head>

<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <h1 data-i18n="app.title">Surveillance de la Débâcle</h1>
            </div>
            <button id="langToggleBtn" class="btn-secondary small" style="margin-left:auto;">EN</button>
        </header>

        <main class="dashboard-grid map-layout" style="display: flex; flex-direction: column; height: calc(100vh - 64px);">
            <div class="map-legend" style="padding: 16px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: center; gap: 24px; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); z-index: 10;">
                <span style="font-weight: 500; color: #475569;" data-i18n="map.legendTitle">État des Rivières :</span>
                <span class="legend-item"><span class="dot green"></span> <span data-i18n="legend.safe">Sécuritaire</span></span>
                <span class="legend-item"><span class="dot yellow"></span> <span data-i18n="legend.monitor">Surveiller</span></span>
                <span class="legend-item"><span class="dot red"></span> <span data-i18n="legend.critical">Critique</span></span>
                <span class="legend-item"><span class="dot gray" style="background: #94a3b8; border-color: #64748b;"></span> <span data-i18n="legend.nodata">Aucune donnée / Hors Zone</span></span>
            </div>
            <div id="map" style="flex: 1; width: 100%; background: #0f172a;"></div>
        </main>
    </div>

    <script type="module" src="/src/map.js"></script>
</body>

</html>
