<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Surveillance en temps réel de la débâcle des rivières. Suivi cartographique et analyse prédictive des risques d'inondation par l'indice thermique cumulé (DJGC, DJDC-5)." />
    <meta name="keywords" content="débâcle, surveillance rivières, inondations, québec, DJGC, DJDC-5, débit eau, crue des eaux" />
    <title>Carte de la Débâcle – Surveillance en Temps Réel</title>
</head>

<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <h1 data-i18n="app.title">Surveillance de la Débâcle</h1>
            </div>
            <button id="langToggleBtn" class="btn-secondary small" style="margin-left:auto;">EN</button>
        </header>

        <main class="map-layout">
            <!-- Sidebar: Monitored Rivers List -->
            <aside class="sidebar glass-panel" id="mapSidebar">
                <div class="section-title" data-i18n="map.sidebar.title">Rivières Surveillées</div>
                <div class="river-status-list" id="riverStatusList">
                    <!-- Dynamically populated by map.js -->
                </div>
            </aside>

            <!-- Map View Area -->
            <section class="map-section">
                <div class="map-legend">
                    <span style="font-weight: 500;" data-i18n="map.legendTitle">État des Rivières :</span>
                    <span class="legend-item"><span class="dot green"></span> <span data-i18n="legend.safe">Sécuritaire</span></span>
                    <span class="legend-item"><span class="dot yellow"></span> <span data-i18n="legend.monitor">À surveiller</span></span>
                    <span class="legend-item"><span class="dot red"></span> <span data-i18n="legend.critical">Critique</span></span>
                    <span class="legend-item"><span class="dot gray"></span> <span data-i18n="legend.nodata">Hors de la zone</span></span>
                </div>
                <div id="map"></div>
            </section>
        </main>
    </div>

    <script type="module" src="/src/map.js"></script>
</body>

</html>
