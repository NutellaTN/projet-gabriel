name: Daily Data Poll

on:
  schedule:
    # 13:00 UTC = 08:00 AM EST (standard) / 09:00 AM EDT (daylight)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  poll-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Daily Poll Script
        env:
          FIREBASE_SA_JSON_B64: ${{ secrets.FIREBASE_SA_JSON_B64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ECCC_CITY_ID: ${{ vars.ECCC_CITY_ID }}
        run: python scripts/poll_daily.py
