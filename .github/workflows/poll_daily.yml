name: Daily Data Poll

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  poll-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run Daily Poll Script
        env:
          FIREBASE_SA_JSON_B64: ${{ secrets.FIREBASE_SA_JSON_B64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ECCC_CITY_ID: ${{ vars.ECCC_CITY_ID }}
        run: |
          python scripts/poll_daily.py --station lassomption
          python scripts/poll_daily.py --station montmorency
          python scripts/poll_daily.py --station chaudiere
          python scripts/poll_daily.py --station chateauguay
          python scripts/poll_daily.py --station matane
          python scripts/poll_daily.py --station matapedia
          python scripts/poll_daily.py --station mistassini
          python scripts/poll_daily.py --station saintfrancois
          python scripts/poll_daily.py --station sainteanne
          python scripts/poll_daily.py --station beaurivage
          python scripts/poll_daily.py --station becancour
          python scripts/poll_daily.py --station eaton
          python scripts/poll_daily.py --station etchemin
          python scripts/poll_daily.py --station saintcharles
