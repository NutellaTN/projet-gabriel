name: Daily Data Poll

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  poll-and-update:
    # Pinned so the ubuntu-latest move to 26.04 (Oct 19 - Nov 19, 2026) can't change the runner mid-season
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run Daily Poll Script
        env:
          FIREBASE_SA_JSON_B64: ${{ secrets.FIREBASE_SA_JSON_B64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          ECCC_CITY_ID: ${{ vars.ECCC_CITY_ID }}
        run: |
          python scripts/poll_daily.py --station all
